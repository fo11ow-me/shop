name: CD

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".claude/**"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_SERVER: ${{ github.repository }}/mall-server
  IMAGE_NGINX: ${{ github.repository }}/mall-nginx

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ============================================
      # Build
      # ============================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Package backend JAR
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests
        working-directory: mall-server

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build admin frontend
        run: |
          npm ci
          npm run build
        working-directory: mall-admin

      - name: Build portal frontend
        run: |
          npm ci
          npm run build
        working-directory: mall-portal

      # ============================================
      # Docker Build & Push
      # ============================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push mall-server image
        uses: docker/build-push-action@v6
        with:
          context: mall-server
          file: mall-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_SERVER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_SERVER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push mall-nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================
      # Deploy
      # ============================================
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Snapshot current images for rollback
        id: snapshot
        run: |
          ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.SERVER_PORT || 22 }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker inspect mall-server --format='{{index .Config.Image}}' 2>/dev/null || echo 'none'" \
            > /tmp/rollback-server
          ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.SERVER_PORT || 22 }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker inspect mall-nginx --format='{{index .Config.Image}}' 2>/dev/null || echo 'none'" \
            > /tmp/rollback-nginx
          echo "Server snapshot: $(cat /tmp/rollback-server)"
          echo "Nginx snapshot:  $(cat /tmp/rollback-nginx)"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/app/mall
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull mall-server mall-nginx
            docker compose up -d --no-deps mall-server mall-nginx

      # ============================================
      # Verify
      # ============================================
      - name: Wait for startup
        run: sleep 10

      - name: Health check with retry
        id: health
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Host: mall.qiujie.net.cn" \
              --max-time 5 \
              "http://${{ secrets.SERVER_HOST }}/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed after ${i}s"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying..."
            sleep 5
          done
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Verify portal frontend
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Host: mall.qiujie.net.cn" --max-time 5 \
            "http://${{ secrets.SERVER_HOST }}/")
          [ "$HTTP_CODE" = "200" ] || { echo "Portal: $HTTP_CODE"; exit 1; }

      - name: Verify admin frontend
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Host: mall.qiujie.net.cn" --max-time 5 \
            "http://${{ secrets.SERVER_HOST }}/admin/")
          [ "$HTTP_CODE" = "200" ] || { echo "Admin: $HTTP_CODE"; exit 1; }

      # ============================================
      # Rollback on failure
      # ============================================
      - name: Rollback server on failure
        if: failure() && steps.snapshot.outcome == 'success'
        run: |
          SERVER_IMG=$(cat /tmp/rollback-server)
          NGINX_IMG=$(cat /tmp/rollback-nginx)
          echo "Rolling back server to $SERVER_IMG"
          echo "Rolling back nginx to $NGINX_IMG"
          ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.SERVER_PORT || 22 }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd /opt/app/mall && \
             docker tag '$SERVER_IMG' ghcr.io/fo11ow-me/mall-server:rollback 2>/dev/null; \
             docker tag '$NGINX_IMG' ghcr.io/fo11ow-me/mall-nginx:rollback 2>/dev/null; \
             docker compose up -d --no-deps mall-server mall-nginx"

      - name: Print logs on failure
        if: failure()
        run: |
          echo "======== mall-server (last 50 lines) ========"
          ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.SERVER_PORT || 22 }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker logs mall-server --tail 50" || true
          echo "======== mall-nginx (last 20 lines) ========"
          ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.SERVER_PORT || 22 }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker logs mall-nginx --tail 20" || true
