name: CD

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".claude/**"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_SERVER: ${{ github.repository }}/mall-server
  IMAGE_NGINX: ${{ github.repository }}/mall-nginx

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ---- Backend ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Package backend JAR
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests
        working-directory: mall-server

      # ---- Frontends ----
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build admin frontend
        run: |
          npm ci
          npm run build
        working-directory: mall-admin

      - name: Build portal frontend
        run: |
          npm ci
          npm run build
        working-directory: mall-portal

      # ---- Docker Build & Push ----
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push mall-server image
        uses: docker/build-push-action@v6
        with:
          context: mall-server
          file: mall-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_SERVER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_SERVER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push mall-nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Deploy ----
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/app/mall
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f

      # ---- Verify ----
      - name: Wait for deployment
        run: sleep 20

      - name: Verify nginx health endpoint
        run: |
          curl -sSf -H "Host: mall.qiujie.net.cn" --max-time 10 "http://${{ secrets.SERVER_HOST }}/health" || {
            echo "Health check failed"
            exit 1
          }

      - name: Verify portal frontend
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: mall.qiujie.net.cn" --max-time 10 "http://${{ secrets.SERVER_HOST }}/")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Portal returned $HTTP_CODE, expected 200"
            exit 1
          fi

      - name: Verify admin frontend
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: mall.qiujie.net.cn" --max-time 10 "http://${{ secrets.SERVER_HOST }}/admin/")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Admin returned $HTTP_CODE, expected 200"
            exit 1
          fi
