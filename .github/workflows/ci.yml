name: CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".claude/**"
  pull_request:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".claude/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mall-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: mall-server/target/site/jacoco/
          retention-days: 7

  frontend-admin-build:
    name: Admin Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mall-admin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: mall-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  frontend-portal-build:
    name: Portal Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mall-portal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: mall-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
