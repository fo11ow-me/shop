services:
  mall-registry:
    image: registry:2
    container_name: mall-registry
    mem_limit: 256m
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry Realm"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - /opt/docker/mall-registry/data:/var/lib/registry
      - /opt/docker/mall-registry/auth:/auth
      - /etc/localtime:/etc/localtime:ro
    networks:
      - my_network
    restart: unless-stopped

  mall-mysql:
    image: mysql:8.0
    container_name: mall-mysql
    mem_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mall
    ports:
      - "3307:3306"
    volumes:
      - /opt/docker/mall-mysql/data:/var/lib/mysql
      - /opt/docker/mall-mysql/conf.d:/etc/mysql/conf.d
      - /etc/localtime:/etc/localtime:ro
    networks:
      - my_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mall-redis:
    image: redis:7-alpine
    container_name: mall-redis
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - /opt/docker/mall-redis/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - my_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mall-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mall-rabbitmq
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - my_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mall-elasticsearch:
    image: elasticsearch:7.17.18
    container_name: mall-elasticsearch
    mem_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    networks:
      - my_network
    restart: unless-stopped

  mall-server:
    image: localhost:5000/mall/mall-server:latest
    container_name: mall-server
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      mall-mysql:
        condition: service_healthy
      mall-redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
      JWT_PORTAL_SECRET: ${JWT_PORTAL_SECRET}
    volumes:
      - /opt/app/mall/file:/opt/app/file
    networks:
      - my_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mall-nginx:
    image: localhost:5000/mall/mall-nginx:latest
    container_name: mall-nginx
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      - mall-server
    networks:
      - my_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  my_network:
    external: true
