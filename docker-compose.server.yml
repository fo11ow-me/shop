services:
  mall-mysql:
    image: mysql:8.0
    container_name: mall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mall
    ports:
      - "3307:3306"
    volumes:
      - /opt/docker/mall-mysql/data:/var/lib/mysql
      - /opt/docker/mall-mysql/conf.d:/etc/mysql/conf.d
      - /etc/localtime:/etc/localtime:ro
    networks:
      - my_network
    restart: unless-stopped

  mall-redis:
    image: redis:7-alpine
    container_name: mall-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - /opt/docker/mall-redis/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - my_network
    restart: unless-stopped

  mall-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mall-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - my_network
    restart: unless-stopped

  mall-elasticsearch:
    image: elasticsearch:7.17.18
    container_name: mall-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    networks:
      - my_network
    restart: unless-stopped

  mall-server:
    image: ghcr.io/fo11ow-me/mall-server:latest
    container_name: mall-server
    depends_on:
      - mall-mysql
      - mall-redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
      JWT_PORTAL_SECRET: ${JWT_PORTAL_SECRET}
    volumes:
      - /opt/app/mall/file:/opt/app/file
    networks:
      - my_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mall-nginx:
    image: ghcr.io/fo11ow-me/mall-nginx:latest
    container_name: mall-nginx
    depends_on:
      - mall-server
    ports:
      - "80:80"
    networks:
      - my_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  my_network:
    external: true
