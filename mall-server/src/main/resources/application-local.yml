spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2-local.sql
      encoding: utf-8
      continue-on-error: true

aliyun:
  oss:
    endpoint: oss-cn-guangzhou.aliyuncs.com
    access-key-id: test-key
    access-key-secret: test-secret
    bucket-name: test-bucket

jwt:
  admin-secret: ${JWT_ADMIN_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  portal-secret: ${JWT_PORTAL_SECRET:6A586E3272357538782F413F4428472B4B6250645367566B5970404E63526655}
  expiration: 7200000

logging:
  level:
    root: WARN
