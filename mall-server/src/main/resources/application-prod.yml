spring:
  datasource:
    url: jdbc:mysql://mall-mysql:3306/mall?useUnicode=true&serverTimezone=Asia/Shanghai
    username: root
    password: CHANGE_ME
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: mall-redis
      port: 6379
      password: CHANGE_ME
      database: 0
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 8
  rabbitmq:
    host: mall-rabbitmq
    port: 5672
    username: admin
    password: CHANGE_ME
  elasticsearch:
    uris: http://mall-elasticsearch:9200

file-path: /opt/app/mall/file/

aliyun:
  oss:
    endpoint: oss-cn-guangzhou.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: mall-quuj
