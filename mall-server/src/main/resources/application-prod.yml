spring:
  datasource:
    url: jdbc:mysql://mall-mysql:3306/mall?useUnicode=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:CHANGEME}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: mall-redis
      port: 6379
      password: ${REDIS_PASSWORD:CHANGEME}
      database: 0
  rabbitmq:
    host: mall-rabbitmq
    port: 5672
    username: admin
    password: ${RABBITMQ_PASSWORD:CHANGEME}
  elasticsearch:
    uris: http://mall-elasticsearch:9200

file-path: /opt/app/mall/file/

aliyun:
  oss:
    endpoint: oss-cn-guangzhou.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID:CHANGEME}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:CHANGEME}
    bucket-name: mall-quuj
