server:
  port: 8800

spring:
  profiles:
    active: dev
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: ${RABBITMQ_PASSWORD:123456}
    listener:
      simple:
        prefetch: 1
        concurrency: 4
        acknowledge-mode: manual
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 3s
    socket-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    rabbit:
      enabled: true
    elasticsearch:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-enums-package: com.qiujie.enums
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  admin-secret: ${JWT_ADMIN_SECRET:CHANGEME}
  portal-secret: ${JWT_PORTAL_SECRET:CHANGEME}
  expiration: 7200000

