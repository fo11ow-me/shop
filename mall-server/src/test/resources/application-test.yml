spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      database: 1
      timeout: 2000ms
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql
      encoding: utf-8
      continue-on-error: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0

aliyun:
  oss:
    endpoint: oss-cn-guangzhou.aliyuncs.com
    access-key-id: test-access-key-id
    access-key-secret: test-access-key-secret
    bucket-name: test-bucket

jwt:
  admin-secret: ${JWT_ADMIN_SECRET:dGVzdC1hZG1pbi1zZWNyZXQtZm9yLW1hbGwtc2VydmVyLWppd3QtMjU2LWJpdA==}
  portal-secret: ${JWT_PORTAL_SECRET:dGVzdC1wb3J0YWwtc2VjcmV0LWZvci1tYWxsLXNlcnZlci1qd3QtMjU2LWJpdA==}
  expiration: 7200000

logging:
  level:
    root: WARN
